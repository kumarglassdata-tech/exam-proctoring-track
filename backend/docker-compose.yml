version: '3.8'
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  judge0:
    image: judge0/judge0-ce:1.13.0
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - REDIS_URL=redis://redis:6379/1
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/judge0

volumes:
  pgdata:
  redisdata:
  miniodata:
